<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owen Wrestling Simulator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #D4AF37;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            width: 95%;
            max-width: 500px;
            border: 3px solid #D4AF37;
            background: #111;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        #ui-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: #000;
            font-size: 14px;
            border-bottom: 2px solid #D4AF37;
        }

        #main-stage {
            position: relative;
            width: 100%;
            height: 350px;
            background: #2d4a3e;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas { display: none; width: 100%; height: 100%; image-rendering: pixelated; }

        #struggle-overlay {
            display: none;
            position: absolute;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10;
        }

        #mash-box {
            background: #222;
            border: 4px solid #ff4d4d;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            animation: pulse 0.5s infinite alternate;
        }

        #stall-warning {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
            display: none;
            z-index: 5;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        #game-over { 
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center; 
            padding: 10px; 
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
        }

        #game-over img { 
            width: 95%; 
            max-width: 450px; 
            border: 4px solid #D4AF37; 
            border-radius: 10px; 
            margin: 10px 0;
        }

        .pinned-text { color: #ff4d4d; margin: 0; font-size: 2.5rem; font-weight: 900; text-shadow: 2px 2px 0px #000; }

        #footer {
            background: #0a0a0a;
            padding: 10px;
            font-size: 11px;
            text-align: center;
            border-top: 1px solid #333;
            line-height: 1.5;
        }

        .key { color: #fff; background: #444; padding: 1px 4px; border-radius: 3px; font-weight: bold; }
        button { padding: 12px 24px; background: #D4AF37; color: #000; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="ui-bar">
        <span>Score: <b id="score">0</b></span>
        <span id="stall-indicator" style="color: #ff4d4d;"></span>
        <span id="state">NEUTRAL</span>
    </div>

    <div id="main-stage">
        <div id="stall-warning">STALLING WARNING!</div>
        
        <div id="menu">
            <h1 style="text-align:center;">OWEN WRESTLING</h1>
            <button onclick="startGame()">START MATCH</button>
        </div>

        <canvas id="gameCanvas" width="500" height="350"></canvas>

        <div id="struggle-overlay">
            <div id="mash-box">
                <h3 style="margin: 0; color: #ff4d4d;">NEAR FALL!</h3>
                <p id="timer-display" style="color: #fff; margin: 5px 0;">Escape in: 10s</p>
                <div style="font-size: 2rem; font-weight: bold;">
                    <span id="current-mashes">0</span> / <span id="target-mashes">?</span>
                </div>
                <p style="font-size: 10px; color: #aaa; margin-top: 10px;">MASH SPACE (NO HOLDING)</p>
            </div>
        </div>

        <div id="game-over">
            <h2 id="death-reason" class="pinned-text">1-2-3! PINNED!</h2>
            <img id="lose-gif" src="owenthrewgif.gif" alt="Funny Lose GIF">
            <button onclick="startGame()" style="margin-top: 5px;">REMATCH</button>
        </div>
    </div>

    <div id="footer">
        <span class="key">WASD</span> Move | <span class="key">E</span> Lunge Takedown | <span class="key">H</span> Sprawl<br>
        Don't Stall! Move or Attack to keep the ref happy.
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const gameOverScreen = document.getElementById('game-over');
    const struggleOverlay = document.getElementById('struggle-overlay');
    const scoreText = document.getElementById('score');
    const stateText = document.getElementById('state');
    const currentMashText = document.getElementById('current-mashes');
    const targetMashText = document.getElementById('target-mashes');
    const timerDisplay = document.getElementById('timer-display');
    const loseGif = document.getElementById('lose-gif');
    const stallWarningUI = document.getElementById('stall-warning');
    const stallIndicator = document.getElementById('stall-indicator');

    const spriteOwen = new Image(); spriteOwen.src = 'black_wrestler_sprite.png';
    const spriteOpponent = new Image(); spriteOpponent.src = 'red_wrestler_sprite.png';
    const iconAlert = new Image(); iconAlert.src = 'exclamation_sprite.png';

    let player, opponent, gameActive, score, animationId, aiTimer;
    let isStruggling = false, currentMashes = 0, targetMashes = 0, struggleTimer = 600;
    let spaceReleased = true, isLunging = false, lungeTimer = 0;
    
    // Stalling Variables
    let stallTimer = 0; 
    let stallCalls = 0;
    let lastActionScore = 0;

    const keys = {};

    window.addEventListener('keydown', e => {
        if (!keys[e.code]) {
            if (e.code === 'Space' && isStruggling && spaceReleased) {
                currentMashes++;
                spaceReleased = false;
                currentMashText.innerText = currentMashes;
                if (currentMashes >= targetMashes) endStruggle(true);
            }
            if (e.code === 'KeyE' && !isStruggling && !isLunging && gameActive) {
                attemptLunge();
            }
        }
        keys[e.code] = true;
    });

    window.addEventListener('keyup', e => {
        keys[e.code] = false;
        if (e.code === 'Space') spaceReleased = true;
    });

    function getRandomTarget() {
        const roll = Math.random();
        if (roll < 0.7) return Math.floor(Math.random() * 21) + 20; 
        return Math.floor(Math.random() * 50) + 20;
    }

    function startGame() {
        menu.style.display = 'none';
        gameOverScreen.style.display = 'none';
        struggleOverlay.style.display = 'none';
        canvas.style.display = 'block';
        
        gameActive = true;
        isStruggling = false;
        isLunging = false;
        score = 0;
        aiTimer = 0;
        stallTimer = 0;
        stallCalls = 0;
        lastActionScore = 0;
        stallIndicator.innerText = "";
        scoreText.innerText = score;
        stateText.innerText = "NEUTRAL";
        
        player = { x: 100, y: 175, size: 50, speed: 4 };
        opponent = { x: 380, y: 175, size: 50, speed: 2.2, isTelegraphing: false, telegraphFrames: 0 };

        gameLoop();
    }

    function attemptLunge() {
        isLunging = true;
        lungeTimer = 15; // 15 frames of high-speed dash
        
        // IF LUNGING WHILE OPPONENT HAS EXCLAMATION: INSTANT NEAR FALL
        if (opponent.isTelegraphing) {
            startStruggle();
            return;
        }

        // Check for normal takedown success
        let dx = player.x - opponent.x;
        let dy = player.y - opponent.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 80) {
            opponent.x += (opponent.x > player.x) ? 150 : -150;
            score += 200;
            stateText.innerText = "TAKEDOWN!";
            setTimeout(() => { if(gameActive) stateText.innerText = "NEUTRAL"; }, 1000);
        }
    }

    function startStruggle() {
        isStruggling = true;
        isLunging = false;
        currentMashes = 0;
        spaceReleased = true;
        targetMashes = getRandomTarget();
        struggleTimer = 600; 
        
        currentMashText.innerText = currentMashes;
        targetMashText.innerText = targetMashes;
        stateText.innerText = "NEAR FALL!";
        stateText.style.color = "#ff4d4d";
        struggleOverlay.style.display = 'flex';
    }

    function endStruggle(escaped) {
        if (escaped) {
            isStruggling = false;
            struggleOverlay.style.display = 'none';
            stateText.innerText = "NEUTRAL";
            stateText.style.color = "#D4AF37";
            opponent.x += (opponent.x > player.x) ? 120 : -120;
            score += 100;
            stallTimer = 0; // Escaping resets stall
        } else {
            endGame("1-2-3! PINNED!");
        }
    }

    function update() {
        if (!gameActive) return;

        if (isStruggling) {
            struggleTimer--;
            timerDisplay.innerText = `Escape in: ${Math.ceil(struggleTimer/60)}s`;
            if (struggleTimer <= 0) endStruggle(false);
            return;
        }

        // Stalling Logic: 15 seconds (900 frames)
        stallTimer++;
        if (score > lastActionScore + 10) { // If player is gaining points (moving/playing)
            stallTimer = 0;
            lastActionScore = score;
            stallWarningUI.style.display = 'none';
        }

        if (stallTimer > 900) { // 15 seconds
            stallCalls++;
            stallTimer = 0;
            if (stallCalls >= 2) {
                endGame("DQ: STALLING!");
            } else {
                stallWarningUI.style.display = 'block';
                stallIndicator.innerText = "⚠ STALL CALL";
                setTimeout(() => { stallWarningUI.style.display = 'none'; }, 2000);
            }
        }

        // Lunge physics
        if (isLunging) {
            let angle = Math.atan2(opponent.y - player.y, opponent.x - player.x);
            player.x += Math.cos(angle) * 12;
            player.y += Math.sin(angle) * 12;
            lungeTimer--;
            if (lungeTimer <= 0) isLunging = false;
        }

        // Standard Movement
        if (!isLunging) {
            if (keys['KeyW'] && player.y > 25) player.y -= player.speed;
            if (keys['KeyS'] && player.y < canvas.height - 25) player.y += player.speed;
            if (keys['KeyA'] && player.x > 25) player.x -= player.speed;
            if (keys['KeyD'] && player.x < canvas.width - 25) player.x += player.speed;
        }

        // AI Logic
        aiTimer++;
        if (aiTimer > 150 && !opponent.isTelegraphing) {
            opponent.isTelegraphing = true;
            opponent.telegraphFrames = 50; 
            aiTimer = 0;
        }

        if (opponent.isTelegraphing) {
            opponent.telegraphFrames--;
            if (opponent.telegraphFrames <= 0) {
                let angle = Math.atan2(player.y - opponent.y, player.x - opponent.x);
                opponent.x += Math.cos(angle) * 90;
                opponent.y += Math.sin(angle) * 90;
                opponent.isTelegraphing = false;
            }
        } else {
            opponent.x += (player.x - opponent.x) / 60;
            opponent.y += (player.y - opponent.y) / 60;
        }

        // Collision
        let dx = player.x - opponent.x;
        let dy = player.y - opponent.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < 35) {
            if (keys['KeyH']) {
                opponent.x += (opponent.x > player.x) ? 50 : -50;
                score += 50;
            } else if (!isLunging) {
                startStruggle();
            }
        }
        
        score++;
        if(score % 60 === 0) scoreText.innerText = Math.floor(score/60);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // DRAW MAT
        ctx.fillStyle = "#2d4a3e";
        ctx.fillRect(0,0, canvas.width, canvas.height);
        
        // Outer Circle
        ctx.strokeStyle = "rgba(212, 175, 55, 0.5)";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(canvas.width/2, canvas.height/2, 160, 0, Math.PI*2);
        ctx.stroke();

        // Inner Circle
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(canvas.width/2, canvas.height/2, 40, 0, Math.PI*2);
        ctx.stroke();

        // Line
        ctx.beginPath();
        ctx.moveTo(canvas.width/2 - 40, canvas.height/2);
        ctx.lineTo(canvas.width/2 + 40, canvas.height/2);
        ctx.stroke();

        // Characters
        ctx.drawImage(spriteOwen, player.x - player.size/2, player.y - player.size/2, player.size, player.size);
        ctx.drawImage(spriteOpponent, opponent.x - opponent.size/2, opponent.y - opponent.size/2, opponent.size, opponent.size);

        if (opponent.isTelegraphing) {
            ctx.drawImage(iconAlert, opponent.x - 15, opponent.y - 55, 30, 30);
        }
        
        if (keys['KeyH']) {
            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(player.x, player.y, 35, 0, Math.PI*2); ctx.stroke();
        }
    }

    function gameLoop() {
        if (!gameActive) return;
        update();
        draw();
        animationId = requestAnimationFrame(gameLoop);
    }

    function endGame(reason) {
        gameActive = false;
        cancelAnimationFrame(animationId);
        canvas.style.display = 'none';
        struggleOverlay.style.display = 'none';
        document.getElementById('death-reason').innerText = reason;
        loseGif.src = "owenthrewgif.gif?t=" + new Date().getTime();
        gameOverScreen.style.display = 'flex';
    }
</script>

</body>
</html>
