<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owen Wrestling Simulator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #D4AF37;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            width: 95%;
            max-width: 500px;
            border: 3px solid #D4AF37;
            background: #111;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        #ui-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: #000;
            font-size: 14px;
            border-bottom: 2px solid #D4AF37;
        }

        #main-stage {
            position: relative;
            width: 100%;
            height: 350px;
            background: radial-gradient(circle, #2d4a3e 60%, #162e24 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas { display: none; width: 100%; height: 100%; image-rendering: pixelated; }

        #struggle-overlay {
            display: none;
            position: absolute;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 10;
        }

        #mash-box {
            background: #222;
            border: 4px solid #ff4d4d;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        #game-over { 
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center; 
            padding: 10px; 
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
        }

        #game-over img { 
            width: 95%; 
            max-width: 450px; 
            border: 4px solid #D4AF37; 
            border-radius: 10px; 
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
            margin: 10px 0;
        }

        .pinned-text {
            color: #ff4d4d; 
            margin: 0; 
            font-size: 2.5rem; 
            font-weight: 900;
            text-shadow: 2px 2px 0px #000;
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            25% { transform: translate(-2px, -1px); }
            50% { transform: translate(2px, 0px); }
            75% { transform: translate(-1px, 2px); }
            100% { transform: translate(1px, -1px); }
        }

        #footer {
            background: #0a0a0a;
            padding: 10px;
            font-size: 11px;
            text-align: center;
            border-top: 1px solid #333;
            line-height: 1.5;
        }

        .key { color: #fff; background: #444; padding: 1px 4px; border-radius: 3px; font-weight: bold; }

        button {
            padding: 12px 24px;
            background: #D4AF37;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            font-size: 1rem;
            transition: transform 0.2s;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="ui-bar">
        <span>Score: <b id="score">0</b></span>
        <span id="state">NEUTRAL</span>
    </div>

    <div id="main-stage">
        <div id="menu">
            <h1 style="text-align:center;">OWEN WRESTLING</h1>
            <button onclick="startGame()">START MATCH</button>
        </div>

        <canvas id="gameCanvas" width="500" height="350"></canvas>

        <div id="struggle-overlay">
            <div id="mash-box">
                <h3 style="margin: 0; color: #ff4d4d;">PINNED!</h3>
                <p id="timer-display" style="color: #fff; margin: 5px 0;">Time Remaining: 10s</p>
                <div style="font-size: 2rem; font-weight: bold;">
                    <span id="current-mashes">0</span> / <span id="target-mashes">?</span>
                </div>
                <p style="font-size: 10px; color: #aaa; margin-top: 10px;">PRESS SPACE RAPIDLY (NO HOLDING)</p>
            </div>
        </div>

        <div id="game-over">
            <h2 class="pinned-text">1-2-3! PINNED!</h2>
            <img id="lose-gif" src="owenthrewgif.gif" alt="Funny Lose GIF">
            <button onclick="startGame()" style="margin-top: 5px;">REMATCH</button>
        </div>
    </div>

    <div id="footer">
        <span class="key">WASD</span> Move | <span class="key">E</span> Takedown Attack<br>
        <span class="key">H</span> Sprawl (Defense) | <span class="key">SPACE</span> Kick Out
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const gameOverScreen = document.getElementById('game-over');
    const struggleOverlay = document.getElementById('struggle-overlay');
    const scoreText = document.getElementById('score');
    const stateText = document.getElementById('state');
    const currentMashText = document.getElementById('current-mashes');
    const targetMashText = document.getElementById('target-mashes');
    const timerDisplay = document.getElementById('timer-display');
    const loseGif = document.getElementById('lose-gif');

    const spriteOwen = new Image(); spriteOwen.src = 'black_wrestler_sprite.png';
    const spriteOpponent = new Image(); spriteOpponent.src = 'red_wrestler_sprite.png';
    const iconAlert = new Image(); iconAlert.src = 'exclamation_sprite.png';

    let player, opponent, gameActive, score, animationId, aiTimer;
    let isStruggling = false;
    let currentMashes = 0;
    let targetMashes = 0;
    let struggleTimer = 600; // 10 seconds at 60fps
    const keys = {};

    // For Anti-Hold logic
    let spaceReleased = true;

    window.addEventListener('keydown', e => {
        if (!keys[e.code]) { // Initial press
            if (e.code === 'Space' && isStruggling && spaceReleased) {
                currentMashes++;
                spaceReleased = false; // Block further increment until release
                currentMashText.innerText = currentMashes;
                if (currentMashes >= targetMashes) endStruggle(true);
            }
            
            // Offensive Takedown logic
            if (e.code === 'KeyE' && !isStruggling && gameActive) {
                checkTakedown();
            }
        }
        keys[e.code] = true;
    });

    window.addEventListener('keyup', e => {
        keys[e.code] = false;
        if (e.code === 'Space') spaceReleased = true;
    });

    function getRandomTarget() {
        const roll = Math.random();
        if (roll < 0.7) return Math.floor(Math.random() * 21) + 20; 
        if (roll < 0.85) return Math.floor(Math.random() * 19) + 1;
        return Math.floor(Math.random() * 35) + 41;
    }

    function startGame() {
        menu.style.display = 'none';
        gameOverScreen.style.display = 'none';
        struggleOverlay.style.display = 'none';
        canvas.style.display = 'block';
        
        gameActive = true;
        isStruggling = false;
        score = 0;
        aiTimer = 0;
        scoreText.innerText = score;
        stateText.innerText = "NEUTRAL";
        stateText.style.color = "#D4AF37";
        
        player = { x: 100, y: 175, size: 50, speed: 4 };
        opponent = { x: 380, y: 175, size: 50, speed: 2.2, isTelegraphing: false, telegraphFrames: 0 };

        gameLoop();
    }

    function startStruggle() {
        isStruggling = true;
        currentMashes = 0;
        spaceReleased = true;
        targetMashes = getRandomTarget();
        struggleTimer = 600; // Exactly 10 seconds
        
        currentMashText.innerText = currentMashes;
        targetMashText.innerText = targetMashes;
        stateText.innerText = "PINNED!";
        stateText.style.color = "#ff4d4d";
        struggleOverlay.style.display = 'flex';
    }

    function checkTakedown() {
        let dx = player.x - opponent.x;
        let dy = player.y - opponent.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < 70) {
            // Success! We initiate the struggle but we are the one pinning them?
            // For now, mashing represents escaping their counter-grapple.
            startStruggle();
        }
    }

    function endStruggle(escaped) {
        if (escaped) {
            isStruggling = false;
            struggleOverlay.style.display = 'none';
            stateText.innerText = "NEUTRAL";
            stateText.style.color = "#D4AF37";
            // Repel opponent
            opponent.x += (opponent.x > player.x) ? 120 : -120;
            score += 500; // Bonus for escaping
        } else {
            endGame();
        }
    }

    function update() {
        if (!gameActive) return;

        if (isStruggling) {
            struggleTimer--;
            timerDisplay.innerText = `Time Remaining: ${Math.ceil(struggleTimer/60)}s`;
            if (struggleTimer <= 0) endStruggle(false);
            return;
        }

        // Player Movement
        if (keys['KeyW'] && player.y > player.size/2) player.y -= player.speed;
        if (keys['KeyS'] && player.y < canvas.height - player.size/2) player.y += player.speed;
        if (keys['KeyA'] && player.x > player.size/2) player.x -= player.speed;
        if (keys['KeyD'] && player.x < canvas.width - player.size/2) player.x += player.speed;

        // AI AI AI
        aiTimer++;
        if (aiTimer > 120 && !opponent.isTelegraphing) {
            opponent.isTelegraphing = true;
            opponent.telegraphFrames = 50; 
            aiTimer = 0;
        }

        if (opponent.isTelegraphing) {
            opponent.telegraphFrames--;
            if (opponent.telegraphFrames <= 0) {
                let angle = Math.atan2(player.y - opponent.y, player.x - opponent.x);
                opponent.x += Math.cos(angle) * 90;
                opponent.y += Math.sin(angle) * 90;
                opponent.isTelegraphing = false;
            }
        } else {
            let dx = player.x - opponent.x;
            let dy = player.y - opponent.y;
            opponent.x += (dx / 50); 
            opponent.y += (dy / 50);
        }

        // Collision & Sprawl Logic
        let dx = player.x - opponent.x;
        let dy = player.y - opponent.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < 35) {
            // If player is holding H (Sprawl), they bounce off
            if (keys['KeyH']) {
                opponent.x += (opponent.x > player.x) ? 40 : -40;
                opponent.y += (opponent.y > player.y) ? 40 : -40;
                score += 10;
            } else {
                startStruggle();
            }
        }
        
        score++;
        if(score % 60 === 0) scoreText.innerText = Math.floor(score/60);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(spriteOwen, player.x - player.size/2, player.y - player.size/2, player.size, player.size);
        ctx.drawImage(spriteOpponent, opponent.x - opponent.size/2, opponent.y - opponent.size/2, opponent.size, opponent.size);

        if (opponent.isTelegraphing) {
            ctx.drawImage(iconAlert, opponent.x - 15, opponent.y - 55, 30, 30);
        }
        
        // Show Sprawl visual
        if (keys['KeyH'] && !isStruggling) {
            ctx.strokeStyle = "cyan";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(player.x, player.y, 30, 0, Math.PI * 2);
            ctx.stroke();
        }
    }

    function gameLoop() {
        if (!gameActive) return;
        update();
        draw();
        animationId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
        gameActive = false;
        cancelAnimationFrame(animationId);
        canvas.style.display = 'none';
        struggleOverlay.style.display = 'none';
        
        // RESET GIF TO BEGINNING by appending a unique string to the URL
        loseGif.src = "owenthrewgif.gif?t=" + new Date().getTime();
        
        gameOverScreen.style.display = 'flex';
    }
</script>

</body>
</html>
