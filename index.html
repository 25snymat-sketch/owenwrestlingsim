<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owen Wrestling Simulator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #D4AF37;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            width: 95%;
            max-width: 500px;
            border: 3px solid #D4AF37;
            background: #111;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        #ui-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: #000;
            font-size: 14px;
            border-bottom: 2px solid #D4AF37;
        }

        #main-stage {
            position: relative;
            width: 100%;
            height: 350px;
            background: radial-gradient(circle, #2d4a3e 60%, #162e24 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas { display: none; width: 100%; height: 100%; image-rendering: pixelated; }

        /* Struggle UI Overlay */
        #struggle-overlay {
            display: none;
            position: absolute;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 10;
        }

        #mash-box {
            background: #222;
            border: 4px solid #ff4d4d;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        #game-over { 
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center; 
            padding: 10px; 
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
        }

        #game-over img { 
            width: 95%; 
            max-width: 450px; 
            border: 4px solid #D4AF37; 
            border-radius: 10px; 
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
            margin: 10px 0;
        }

        .pinned-text {
            color: #ff4d4d; 
            margin: 0; 
            font-size: 2.5rem; 
            font-weight: 900;
            text-shadow: 2px 2px 0px #000;
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            25% { transform: translate(-2px, -1px); }
            50% { transform: translate(2px, 0px); }
            75% { transform: translate(-1px, 2px); }
            100% { transform: translate(1px, -1px); }
        }

        #footer {
            background: #0a0a0a;
            padding: 10px;
            font-size: 12px;
            text-align: center;
            border-top: 1px solid #333;
        }

        .key { color: #fff; background: #444; padding: 2px 5px; border-radius: 3px; font-weight: bold; }

        button {
            padding: 12px 24px;
            background: #D4AF37;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); background: #b8972f; }

        h1 { font-size: 1.5rem; margin-bottom: 20px; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="ui-bar">
        <span>Score: <b id="score">0</b></span>
        <span id="state" style="color: #D4AF37;">NEUTRAL</span>
    </div>

    <div id="main-stage">
        <div id="menu">
            <h1>OWEN WRESTLING</h1>
            <button onclick="startGame()">START MATCH</button>
        </div>

        <canvas id="gameCanvas" width="500" height="350"></canvas>

        <div id="struggle-overlay">
            <div id="mash-box">
                <h3 style="margin: 0; color: #ff4d4d;">KICK OUT!</h3>
                <p style="font-size: 12px; color: #eee;">MASH <span class="key">SPACE</span></p>
                <div style="font-size: 2rem; font-weight: bold;">
                    <span id="current-mashes">0</span> / <span id="target-mashes">?</span>
                </div>
            </div>
        </div>

        <div id="game-over">
            <h2 class="pinned-text">PINNED!</h2>
            <img src="owenthrewgif.gif" alt="Funny Lose GIF">
            <button onclick="startGame()" style="margin-top: 5px;">REMATCH</button>
        </div>
    </div>

    <div id="footer">
        <span class="key">WASD</span> Move | <span class="key">SPACE</span> Kick Out
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const gameOverScreen = document.getElementById('game-over');
    const struggleOverlay = document.getElementById('struggle-overlay');
    const scoreText = document.getElementById('score');
    const stateText = document.getElementById('state');
    const currentMashText = document.getElementById('current-mashes');
    const targetMashText = document.getElementById('target-mashes');

    const spriteOwen = new Image(); spriteOwen.src = 'black_wrestler_sprite.png';
    const spriteOpponent = new Image(); spriteOpponent.src = 'red_wrestler_sprite.png';
    const iconAlert = new Image(); iconAlert.src = 'exclamation_sprite.png';

    let player, opponent, gameActive, score, animationId, aiTimer;
    let isStruggling = false;
    let currentMashes = 0;
    let targetMashes = 0;
    let struggleTimer = 0;
    const keys = {};

    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        // Check for mash input
        if (e.code === 'Space' && isStruggling) {
            currentMashes++;
            currentMashText.innerText = currentMashes;
            if (currentMashes >= targetMashes) {
                endStruggle(true);
            }
        }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function getRandomTarget() {
        // Weighted logic: Most likely between 20-40, but can be 1-75
        const roll = Math.random();
        if (roll < 0.7) { // 70% chance for mid-range
            return Math.floor(Math.random() * 21) + 20; 
        } else if (roll < 0.85) { // 15% chance for easy
            return Math.floor(Math.random() * 19) + 1;
        } else { // 15% chance for hard
            return Math.floor(Math.random() * 35) + 41;
        }
    }

    function startGame() {
        menu.style.display = 'none';
        gameOverScreen.style.display = 'none';
        struggleOverlay.style.display = 'none';
        canvas.style.display = 'block';
        
        gameActive = true;
        isStruggling = false;
        score = 0;
        aiTimer = 0;
        scoreText.innerText = score;
        stateText.innerText = "NEUTRAL";
        
        player = { x: 100, y: 175, size: 50, speed: 4 };
        opponent = { x: 380, y: 175, size: 50, speed: 2, isTelegraphing: false, telegraphFrames: 0 };

        gameLoop();
    }

    function startStruggle() {
        isStruggling = true;
        currentMashes = 0;
        targetMashes = getRandomTarget();
        struggleTimer = 600; // Player has ~3 seconds to escape (60fps * 10)
        
        currentMashText.innerText = currentMashes;
        targetMashText.innerText = targetMashes;
        stateText.innerText = "PINNED!";
        stateText.style.color = "#ff4d4d";
        struggleOverlay.style.display = 'flex';
    }

    function endStruggle(escaped) {
        if (escaped) {
            isStruggling = false;
            struggleOverlay.style.display = 'none';
            stateText.innerText = "NEUTRAL";
            stateText.style.color = "#D4AF37";
            // Repel opponent slightly
            opponent.x += (opponent.x > player.x) ? 100 : -100;
        } else {
            endGame();
        }
    }

    function update() {
        if (!gameActive) return;

        if (isStruggling) {
            struggleTimer--;
            if (struggleTimer <= 0) endStruggle(false);
            return; // Stop movement while struggling
        }

        // Player Movement
        if (keys['KeyW'] && player.y > player.size/2) player.y -= player.speed;
        if (keys['KeyS'] && player.y < canvas.height - player.size/2) player.y += player.speed;
        if (keys['KeyA'] && player.x > player.size/2) player.x -= player.speed;
        if (keys['KeyD'] && player.x < canvas.width - player.size/2) player.x += player.speed;

        // AI Logic
        aiTimer++;
        if (aiTimer > 150 && !opponent.isTelegraphing) {
            opponent.isTelegraphing = true;
            opponent.telegraphFrames = 45; 
            aiTimer = 0;
        }

        if (opponent.isTelegraphing) {
            opponent.telegraphFrames--;
            if (opponent.telegraphFrames <= 0) {
                let angle = Math.atan2(player.y - opponent.y, player.x - opponent.x);
                opponent.x += Math.cos(angle) * 80; // Speed up the charge
                opponent.y += Math.sin(angle) * 80;
                opponent.isTelegraphing = false;
            }
        } else {
            if (opponent.x > player.x) opponent.x -= opponent.speed;
            else opponent.x += opponent.speed;
            if (opponent.y > player.y) opponent.y -= opponent.speed;
            else opponent.y += opponent.speed;
        }

        // Collision Check
        let dx = player.x - opponent.x;
        let dy = player.y - opponent.y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 35) {
            startStruggle();
        }
        
        score++;
        if(score % 60 === 0) scoreText.innerText = Math.floor(score/60);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Sprites
        ctx.drawImage(spriteOwen, player.x - player.size/2, player.y - player.size/2, player.size, player.size);
        ctx.drawImage(spriteOpponent, opponent.x - opponent.size/2, opponent.y - opponent.size/2, opponent.size, opponent.size);

        // Draw Warning Sprite
        if (opponent.isTelegraphing) {
            ctx.drawImage(iconAlert, opponent.x - 15, opponent.y - 55, 30, 30);
        }
    }

    function gameLoop() {
        if (!gameActive) return;
        update();
        draw();
        animationId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
        gameActive = false;
        isStruggling = false;
        cancelAnimationFrame(animationId);
        canvas.style.display = 'none';
        struggleOverlay.style.display = 'none';
        gameOverScreen.style.display = 'flex';
    }
</script>

</body>
</html>
